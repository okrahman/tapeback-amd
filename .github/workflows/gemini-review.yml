name: Gemini Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check API key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY not configured, skipping review"
            exit 0
          fi
          echo "has_key=true" >> "$GITHUB_ENV"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        if: env.has_key == 'true'
        with:
          fetch-depth: 0

      - name: Get PR diff
        if: env.has_key == 'true'
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD > /tmp/diff.txt

      - name: Review with Gemini
        if: env.has_key == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7.1.0
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const apiKey = process.env.GEMINI_API_KEY;
            if (!apiKey) {
              console.log('GEMINI_API_KEY not configured, skipping review');
              return;
            }

            const MAX_DIFF_CHARS = 30000;  // keep the prompt within model limits
            const fs = require('fs');
            const diff = fs.readFileSync('/tmp/diff.txt', 'utf8').slice(0, MAX_DIFF_CHARS);
            if (!diff.trim()) {
              console.log('Empty diff, nothing to review');
              return;
            }

            const prompt = `You are reviewing a pull request for tapeback, a Python 3.13 CLI tool
            that records and transcribes meeting audio on Linux (PulseAudio/PipeWire capture,
            faster-whisper, pyannote, Obsidian markdown output).

            Review the diff against these project rules and report only real problems:
            - Security: no hardcoded secrets/tokens/passwords; no shell=True in subprocess; no
              unsanitized user input in commands or file paths; API keys must not leak in logs/errors.
            - No magic numbers: thresholds, limits, sizes and ratios belong in settings.py
              (TAPEBACK_ env vars) or const.py, not inline literals or function-default values.
            - No hardcoded audio device names; no absolute paths in code.
            - No local imports inside functions (all imports at the top of the file).
            - Domain models (Segment, Word, ...) live in models.py, not in infrastructure modules.
            - Comments and logs in English; keep each file under 500 lines.
            - Flag performance regressions, code duplication, and broad except clauses that
              silently swallow errors (e.g. an unconditional CUDA->CPU fallback).

            Avoid false positives:
            - A removed line in .gitignore means that path is NO LONGER ignored (now tracked),
              not that the file was deleted.
            - The diff can be partial: a symbol can be defined, called, or imported in a file not
              shown. Don't report something as missing/uncalled unless the diff itself removes it.

            Be concise. Group findings by severity (P0/P1/P2). If the diff looks good, say so briefly.

            Diff:
            ${diff}`;

            const response = await fetch(
              'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent',
              {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'x-goog-api-key': apiKey,
                },
                body: JSON.stringify({
                  contents: [{ parts: [{ text: prompt }] }]
                })
              }
            );

            const data = await response.json();
            if (data.error) {
              console.log(`Gemini API error: ${data.error.message}`);
              return;
            }

            const review = data.candidates?.[0]?.content?.parts?.[0]?.text;
            if (!review) {
              console.log('No review generated');
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🤖 Gemini Code Review\n\n${review}`
            });
