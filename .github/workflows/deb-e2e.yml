name: deb-e2e

# End-to-end test for the Debian/Ubuntu packaging path: build the .deb on
# every PR that touches packaging-relevant files, then `apt install` it in a
# matrix of containers and verify the wrapper + bundled Python actually run.
# Catches regressions in build-deb.sh, nfpm configs, or src/ changes that
# break the bundled venv before they reach a release tag.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "packaging/**"
      - "scripts/build-deb.sh"
      - "pyproject.toml"
      - "src/**"
      - ".github/workflows/deb-e2e.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4.2.0

      - name: Install nfpm
        run: |
          NFPM_VERSION=2.39.0
          curl -sSL -o /tmp/nfpm.deb \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb"
          sudo dpkg -i /tmp/nfpm.deb

      - name: Build wheel
        run: uv build

      - name: Build .deb packages
        run: ./scripts/build-deb.sh dist/tapeback-*.whl

      - name: Upload .deb artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: tapeback-debs
          path: dist/*.deb
          retention-days: 7

  smoke:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:26.04
          - ubuntu:24.04
          - ubuntu:22.04
          - debian:13
          - debian:12
    steps:
      - name: Download .deb artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b6d35f1fd534f73aa55a4fc0  # v4.3.0
        with:
          name: tapeback-debs
          path: dist

      - name: List .debs
        run: ls -la dist/

      - name: Smoke test on ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD/dist:/dist" "${{ matrix.image }}" bash -c '
              set -e
              apt-get update -qq
              apt-get install -y -qq /dist/tapeback_*.deb
              echo "=== tapeback --version ==="
              tapeback --version
              echo "=== tapeback status ==="
              tapeback status
              echo "=== bundled python ==="
              /opt/tapeback/venv/bin/python --version
          '
