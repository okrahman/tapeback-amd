name: tapeback-tray
arch: all
platform: linux
version: ${VERSION}
section: sound
priority: optional
maintainer: "Yast <yastcher@gmail.com>"
description: |
  System tray icon for tapeback — start/stop recording from the tray.
  Meta-package: dbus-next is installed into /opt/tapeback/'s virtualenv
  by the post-install hook. The tray uses StatusNotifierItem directly
  over D-Bus (no PyGObject / pystray needed). On GNOME, also install
  gnome-shell-extension-appindicator (recommended below) — GNOME Shell
  does not display SNI items without it.
homepage: https://github.com/yastcher/tapeback
license: Apache-2.0

depends:
  - tapeback (= ${VERSION})

recommends:
  - gnome-shell-extension-appindicator

scripts:
  postinstall: ./packaging/deb/postinst/tapeback-tray.sh
  preremove: ./packaging/deb/prerm/tapeback-tray.sh
