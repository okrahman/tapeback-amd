name: tapeback-tray
arch: all
platform: linux
version: ${VERSION}
section: sound
priority: optional
maintainer: "Yast <yastcher@gmail.com>"
description: |
  System tray icon for tapeback — start/stop recording from the tray.
  Meta-package: pystray + Pillow are installed into /opt/tapeback/'s
  virtualenv by the post-install hook.
  On GNOME Wayland, also install gnome-shell-extension-appindicator
  (recommended below) — without it the tray menu will not respond.
homepage: https://github.com/yastcher/tapeback
license: Apache-2.0

depends:
  - tapeback (= ${VERSION})

recommends:
  - gnome-shell-extension-appindicator

scripts:
  postinstall: ./packaging/deb/postinst/tapeback-tray.sh
  preremove: ./packaging/deb/prerm/tapeback-tray.sh
